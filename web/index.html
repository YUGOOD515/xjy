<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f1e7" />
    <meta
      name="description"
      content="VERDANT：从币种指纹观察市场，沿着数据核验交易、理解风险并记录证据。"
    />
    <title>资产观察 · VERDANT</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Vite serves this as raw CSS in dev (?direct) and hashes it at build time, so styles
         block the first paint and page switches never flash an unstyled shell. -->
    <link rel="stylesheet" href="/style.css?direct" />
  </head>
  <body>
    <a class="skip-link fixed bg-paper p-[14px] [z-index:100]" href="#main">跳到主要内容</a>
    <header class="site-header max-w-[1480px] m-auto min-h-[100px] flex items-center gap-7 [border-bottom:1px_solid_var(--color-ink)] laptop:gap-[18px] laptop:flex-wrap">
      <a class="brand flex items-center gap-[10px] shrink-0 tracking-[-0.5px]" href="/" aria-label="VERDANT 资产观察首页"
        ><svg
          viewBox="0 0 40 40"
          width="36"
          height="40"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M8 26C3 8 28 0 34 16M12 30C4 9 31 4 30 21M17 33C4 17 24 5 26 19c1 6-7 6-7 0M22 35C10 29 9 18 16 13M29 31c-4 0-8-3-10-7M34 26c-2 1-4 1-6 0"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          /></svg
        ><span>VERDANT<small>资产、指纹与证据</small></span></a
      >
      <nav aria-label="主导航">
        <a href="/" data-nav="/">资产观察</a
        ><a href="/investigate" data-nav="/investigate">交易核验</a
        ><a href="/report" data-nav="/report">真实报告</a
        ><a href="/risk-lab" data-nav="/risk-lab">风险研究</a
        ><a href="/guardian" data-nav="/guardian">保护实验</a
        ><a href="/attestations" data-nav="/attestations">报告存证</a
        ><a href="/collection" data-nav="/collection">指纹收藏</a>
      </nav>
      <button class="wallet-button [border:1px_solid_var(--color-ink)] [padding:10px_14px] flex gap-2 items-center whitespace-nowrap laptop:ml-auto" data-action="wallet">
        <span aria-hidden="true">▱</span><span id="wallet-label">连接钱包</span>
      </button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer max-w-[1345px] [margin:0_auto] [padding:29px_0_35px] [border-top:1px_solid_var(--color-ink)] grid grid-cols-[1fr_auto] gap-[17px] text-[11px] text-ink-soft laptop:[margin:0_4.5%] phone:[padding:24px_0] phone:grid-cols-[1fr] phone:gap-[13px]">
      <a class="footer-name text-ink" href="/">VERDANT / 让每一次判断有据可循。</a>
      <div>
        <button data-action="guide">读懂货币指纹</button
        ><span>BOT Chain Mainnet</span>
      </div>
      <small
        >指纹是数据表达。来源、范围与未知项保留在各模块中；研究与收藏不构成交易授权。</small
      >
    </footer>
    <dialog id="modal"><div id="modal-body"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
